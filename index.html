
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f1923; color: #e0e0e0; min-height: 100vh;
  }
  .header {
    background: #1a2733; padding: 12px 16px; display: flex;
    align-items: center; border-bottom: 1px solid #2a3a4a;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-left svg { width: 28px; height: 28px; fill: #4fc3f7; }
  .header-title { font-size: 18px; font-weight: 700; color: #fff; }
  .header-subtitle { font-size: 11px; color: #78909c; }

  .api-bar {
    background: #162029; padding: 10px 16px; display: flex;
    align-items: center; gap: 8px; border-bottom: 1px solid #2a3a4a; flex-wrap: wrap;
  }
  .api-bar label { font-size: 12px; color: #90a4ae; font-weight: 600; white-space: nowrap; }
  .api-bar input {
    flex: 1; min-width: 180px; background: #0f1923; border: 1px solid #37474f;
    border-radius: 6px; padding: 8px 12px; color: #e0e0e0; font-size: 13px;
    font-family: monospace; outline: none;
  }
  .api-bar input:focus { border-color: #4fc3f7; }
  .api-bar input::placeholder { color: #546e7a; }
  .btn-save {
    background: #00897b; color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .btn-save:hover { background: #00796b; }

  .search-bar {
    background: #1a2733; padding: 10px 16px; display: flex;
    align-items: center; gap: 8px; border-bottom: 1px solid #2a3a4a; flex-wrap: wrap;
  }
  .search-bar select, .search-bar input {
    background: #0f1923; border: 1px solid #37474f; border-radius: 6px;
    padding: 8px 10px; color: #e0e0e0; font-size: 13px; outline: none;
  }
  .search-bar input { flex: 1; min-width: 150px; }
  .search-bar select:focus, .search-bar input:focus { border-color: #4fc3f7; }
  .search-bar input::placeholder { color: #546e7a; }
  .btn-search {
    background: #e53935; color: #fff; border: none; border-radius: 6px;
    padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-search:hover { background: #c62828; }
  .btn-reset {
    background: #1565c0; color: #fff; border: none; border-radius: 6px;
    padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-reset:hover { background: #0d47a1; }
  .pagination { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .pagination button {
    background: #0f1923; border: 1px solid #37474f; color: #90a4ae;
    border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .pagination button:hover { border-color: #4fc3f7; color: #4fc3f7; }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination span { font-size: 12px; color: #78909c; padding: 0 6px; }

  .main { display: flex; height: calc(100vh - 165px); min-height: 500px; }

  .sidebar {
    width: 210px; min-width: 210px; background: #162029;
    border-right: 1px solid #2a3a4a; display: flex; flex-direction: column;
  }
  .sidebar-header {
    padding: 10px 12px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid #2a3a4a;
  }
  .sidebar-header span { font-size: 13px; font-weight: 700; color: #b0bec5; }
  .sidebar-badge {
    background: #37474f; color: #90a4ae; font-size: 11px;
    padding: 2px 8px; border-radius: 10px; font-weight: 600;
  }
  .sidebar-list { flex: 1; overflow-y: auto; }
  .sidebar-list::-webkit-scrollbar { width: 4px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: #37474f; border-radius: 2px; }

  .cctv-item {
    padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #1e2d3a; transition: background 0.15s;
  }
  .cctv-item:hover { background: #1e2d3a; }
  .cctv-item.active { background: #1a3a4a; border-left: 3px solid #4fc3f7; }
  .cctv-name {
    font-size: 12px; font-weight: 600; color: #e0e0e0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cctv-addr {
    font-size: 10px; color: #78909c; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cctv-tag {
    display: inline-block; font-size: 9px; padding: 1px 5px;
    border-radius: 3px; margin-top: 3px; font-weight: 600;
  }
  .tag-child { background: #1b5e20; color: #a5d6a7; }
  .tag-traffic { background: #0d47a1; color: #90caf9; }
  .tag-etc { background: #37474f; color: #b0bec5; }
  .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #4caf50; margin-right: 4px; vertical-align: middle;
  }

  .loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 40px; color: #546e7a; font-size: 13px; gap: 12px;
  }
  .spinner {
    width: 28px; height: 28px; border: 3px solid #2a3a4a;
    border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 16px; color: #546e7a; font-size: 12px; text-align: center; gap: 6px;
  }

  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .viewer {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #0a1218; position: relative;
  }
  .viewer-placeholder { text-align: center; color: #546e7a; }
  .viewer-placeholder svg { width: 80px; height: 80px; fill: #37474f; margin-bottom: 16px; }
  .viewer-placeholder p { font-size: 14px; margin-bottom: 6px; }
  .viewer-placeholder .sub { font-size: 12px; color: #37474f; }

  .stream-detail {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding: 20px; overflow-y: auto;
  }
  .stream-box {
    width: 100%; max-width: 820px; aspect-ratio: 16/9; background: #111;
    border-radius: 8px; border: 1px solid #2a3a4a; position: relative;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .stream-label {
    position: absolute; top: 10px; left: 12px; background: rgba(0,0,0,0.75);
    color: #4fc3f7; font-size: 11px; padding: 4px 10px; border-radius: 4px;
    font-weight: 600; z-index: 2; max-width: 70%; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  .info-card {
    margin-top: 12px; width: 100%; max-width: 820px;
    background: #162029; border-radius: 8px; border: 1px solid #2a3a4a;
    padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px;
  }
  .info-field { display: flex; flex-direction: column; gap: 2px; }
  .info-field .lbl { font-size: 10px; color: #546e7a; font-weight: 600; }
  .info-field .val { font-size: 12px; color: #e0e0e0; word-break: break-all; }

  .toast {
    position: fixed; top: 16px; right: 16px; padding: 12px 20px;
    border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 9999;
    transform: translateX(120%); transition: transform 0.3s ease; max-width: 420px;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { background: #1b5e20; color: #a5d6a7; border: 1px solid #2e7d32; }
  .toast.error   { background: #b71c1c; color: #ef9a9a; border: 1px solid #c62828; }
  .toast.info    { background: #0d47a1; color: #90caf9; border: 1px solid #1565c0; }

  .info-bar {
    background: #162029; padding: 7px 16px; display: flex;
    align-items: center; justify-content: space-between;
    border-top: 1px solid #2a3a4a; font-size: 11px; color: #546e7a; flex-wrap: wrap; gap: 6px;
  }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px;
  }
  .status-dot.ok  { background: #4caf50; }
  .status-dot.err { background: #e53935; }
  .status-dot.wait{ background: #ff9800; }

  .fade-in { animation: fadeIn 0.3s ease both; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }

  @media (max-width: 600px) {
    .sidebar { width: 150px; min-width: 150px; }
    .info-card { grid-template-columns: 1fr 1fr; }
    .pagination { margin-left: 0; margin-top: 4px; }
  }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <svg viewBox="0 0 24 24"><path d="M18 10.48V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v7c0 1.1.9 2 2 2h1v3l3-3h2.52A7.987 7.987 0 0 1 10 12.48c0-1.64.8-3.1 2.03-4.01A3.005 3.005 0 0 1 15 6.48c.83 0 1.58.34 2.12.88.37-.22.78-.38 1.22-.38h-.34zM17 12c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zm0-5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
    <div>
      <div class="header-title">CCTV 뷰어</div>
      <div class="header-subtitle">행정안전부 공공데이터 API · apis.data.go.kr/1741000/cctv_info</div>
    </div>
  </div>
</div>

<!-- API Key Bar -->
<div class="api-bar">
  <label>🔑 인증키</label>
  <input type="text" id="apiKeyInput" placeholder="공공데이터포털 일반 인증키 (Encoding 키)" />
  <button class="btn-save" id="btnSaveKey">저장</button>
</div>

<!-- Search Bar -->
<div class="search-bar">
  <select id="filterPurpose">
    <option value="">전체 목적</option>
    <option value="어린이보호">어린이보호</option>
    <option value="교통단속">교통단속</option>
    <option value="방범">방범</option>
    <option value="재난재해">재난재해</option>
    <option value="주정차단속">주정차단속</option>
  </select>
  <input type="text" id="searchKeyword" placeholder="주소, 관리기관명으로 검색..." />
  <button class="btn-search" id="btnSearch">검색</button>
  <button class="btn-reset" id="btnReset">초기화</button>
  <div class="pagination">
    <button id="btnPrev" disabled>◀ 이전</button>
    <span id="pageInfo">- / -</span>
    <button id="btnNext" disabled>다음 ▶</button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>CCTV 목록</span>
      <span class="sidebar-badge" id="totalCount">0건</span>
    </div>
    <div class="sidebar-list" id="cctvList">
      <div class="empty-state">
        <p>🔑 API 키를 저장한 후</p>
        <p>검색 버튼을 눌러주세요</p>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="viewer" id="viewer">
      <div class="viewer-placeholder" id="viewerPlaceholder">
        <svg viewBox="0 0 24 24"><path d="M18 10.48V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v7c0 1.1.9 2 2 2h1v3l3-3h2.52A7.987 7.987 0 0 1 10 12.48c0-1.64.8-3.1 2.03-4.01A3.005 3.005 0 0 1 15 6.48c.83 0 1.58.34 2.12.88.37-.22.78-.38 1.22-.38h-.34zM17 12c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zm0-5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <p>좌측 목록에서 CCTV를 선택하세요</p>
        <p class="sub">총 381,409건의 CCTV 설치정보가 제공됩니다</p>
      </div>
      <div class="stream-detail" id="streamDetail" style="display:none;">
        <div class="stream-box" id="streamBox"></div>
        <div class="info-card" id="infoCard"></div>
      </div>
    </div>

    <div class="info-bar">
      <div id="statusText"><span class="status-dot wait"></span>API 연결 대기중</div>
      <div id="endpointText">https://apis.data.go.kr/1741000/cctv_info</div>
    </div>
  </div>
</div>

<script>
// ============================================================
//  행정안전부 CCTV 설치정보 API 연동
//  End Point: https://apis.data.go.kr/1741000/cctv_info
//
//  ★ 실제 응답 JSON 구조 (스크린샷 분석):
//  응답 최상위 키가 한글일 수도, 영문일 수도 있으므로
//  여러 구조를 모두 대응하는 범용 파서 사용
//
//  CCTV 항목 필드:
//  MNG_NO, OPN_ATMY_GRP_CD, SHT_ANGLE_INFO,
//  WGS84_LAT, WGS84_LOT, CAM_CNTOM, CAM_PIXEL_CNT,
//  DAT_CRTR_YMD, DAT_UPDT_PNT, DAT_UPDT_SE,
//  INSTL_PRPS_SE_NM, INSTL_YM, KPNG_DAY_CNT,
//  LAST_MDCN_PNT, LCTN_LOTNO_ADDR, LCTN_ROAD_NM_ADDR,
//  MNG_INST_NM, MNG_INST_TELNO
// ============================================================

const App = (() => {

  const BASE = 'https://apis.data.go.kr/1741000/cctv_info';

  // 오퍼레이션 후보 목록 — 첫 번째 성공한 경로를 기억
  const OP_CANDIDATES = [
    '/getCCTVList',
    '/getCctvList',
    '/getCCTVInfo',
    '/getCctvInfo',
    '',                // 오퍼레이션 없이 베이스 URL 직접
  ];

  const PAGE_SIZE = 10;

  let state = {
    apiKey: localStorage.getItem('cctv_key') || '',
    data: [],
    totalCount: 0,
    page: 1,
    pages: 0,
    selected: null,
    loading: false,
    opPath: localStorage.getItem('cctv_op') || null, // 성공한 오퍼레이션 경로 캐시
  };

  const $ = id => document.getElementById(id);

  function init() {
    if (state.apiKey) $('apiKeyInput').value = state.apiKey;

    $('btnSaveKey').onclick = saveKey;
    $('btnSearch').onclick  = () => { state.page = 1; fetchData(); };
    $('btnReset').onclick   = reset;
    $('btnPrev').onclick    = () => { if (state.page > 1) { state.page--; fetchData(); } };
    $('btnNext').onclick    = () => { if (state.page < state.pages) { state.page++; fetchData(); } };
    $('searchKeyword').onkeydown = e => { if (e.key === 'Enter') { state.page = 1; fetchData(); } };
  }

  function saveKey() {
    const k = $('apiKeyInput').value.trim();
    if (!k) { toast('API 인증키를 입력해주세요.', 'error'); return; }
    state.apiKey = k;
    state.opPath = null; // 키 변경 시 오퍼레이션 재탐색
    localStorage.setItem('cctv_key', k);
    localStorage.removeItem('cctv_op');
    toast('인증키 저장 완료', 'success');
  }

  // ── 핵심: API 호출 ──
  async function fetchData() {
    if (!state.apiKey) { toast('먼저 API 인증키를 저장해주세요.', 'error'); return; }
    if (state.loading) return;
    state.loading = true;
    setStatus('loading');
    renderLoading();

    // 공통 파라미터
    const params = new URLSearchParams({
      serviceKey: state.apiKey,
      pageNo:     String(state.page),
      numOfRows:  String(PAGE_SIZE),
      type:       'json',
    });

    // 이미 성공한 오퍼레이션이 있으면 바로 시도
    if (state.opPath !== null) {
      const ok = await tryFetch(BASE + state.opPath, params);
      if (ok) { state.loading = false; return; }
      // 실패하면 재탐색
      state.opPath = null;
    }

    // 오퍼레이션 자동 탐색
    for (const op of OP_CANDIDATES) {
      const ok = await tryFetch(BASE + op, params);
      if (ok) {
        state.opPath = op;
        localStorage.setItem('cctv_op', op);
        state.loading = false;
        return;
      }
    }

    // 모두 실패
    setStatus('err');
    renderError(
      '모든 엔드포인트 시도 실패\n\n' +
      '확인사항:\n' +
      '① 인증키가 올바른지 확인 (Encoding 키 사용)\n' +
      '② 공공데이터포털에서 해당 API 활용 승인 완료 여부\n' +
      '③ CORS 차단 시 프록시 서버 필요'
    );
    toast('API 호출 실패 — 인증키 및 승인 상태를 확인해주세요', 'error');
    state.loading = false;
  }

  // 단일 URL 시도 → 성공 true / 실패 false
  async function tryFetch(url, params) {
    const fullUrl = `${url}?${params}`;
    $('endpointText').textContent = url;

    try {
      const res = await fetch(fullUrl);
      const text = await res.text();

      // 404 / 400 등 → 다음 후보로
      if (!res.ok) {
        console.warn(`[${res.status}] ${url}`);
        return false;
      }

      let json;
      try {
        json = JSON.parse(text);
      } catch {
        // XML 에러 응답 체크
        if (text.includes('<returnReasonCode>')) {
          const code = text.match(/<returnReasonCode>(.*?)<\/returnReasonCode>/)?.[1];
          const msg  = text.match(/<returnAuthMsg>(.*?)<\/returnAuthMsg>/)?.[1];
          renderError(`인증 오류 [${code}]: ${msg}`);
          setStatus('err');
          toast(`인증 오류: ${msg}`, 'error');
        }
        return false;
      }

      // ── 범용 응답 파서 ──
      const parsed = parseResponse(json);
      if (!parsed) return false;

      state.data       = parsed.items;
      state.totalCount = parsed.totalCount;
      state.pages      = Math.max(1, Math.ceil(parsed.totalCount / PAGE_SIZE));

      renderList(state.data);
      updatePaging();
      setStatus('ok');
      toast(`${state.totalCount.toLocaleString()}건 조회 (${state.page}/${state.pages})`, 'success');
      return true;

    } catch (err) {
      if (err instanceof TypeError && err.message === 'Failed to fetch') {
        renderError(
          'CORS 정책으로 브라우저 직접 호출이 차단되었습니다.\n\n' +
          '해결방법:\n' +
          '① Node.js / Python 등 백엔드 프록시 서버 경유\n' +
          '② 개발용 CORS 브라우저 확장 프로그램 사용\n' +
          '③ 로컬 프록시 (예: cors-anywhere)'
        );
        setStatus('err');
        toast('CORS 오류 — 프록시 서버가 필요합니다', 'error');
      }
      return false;
    }
  }

  // ── 범용 응답 파서 (한글/영문 키 모두 대응) ──
  function parseResponse(json) {
    let body, header, items, totalCount;

    // 패턴 1: { response: { header, body: { items: { item: [...] }, totalCount } } }
    if (json.response) {
      header = json.response.header;
      body   = json.response.body;
    }
    // 패턴 2: { 공문: { header, 본문: { 항목: { 항목: [...] }, totalCount } } }
    else if (json['공문']) {
      header = json['공문']['header'] || json['공문']['헤더'];
      body   = json['공문']['본문'] || json['공문']['body'];
    }
    // 패턴 3: 최상위에 바로 body 구조
    else if (json.body || json.items || json.data) {
      body = json.body || json;
    }
    else {
      return null;
    }

    // 헤더 에러 체크
    if (header) {
      const code = String(header.resultCode ?? header.code ?? '');
      if (code !== '00' && code !== '0' && code !== '') {
        renderError(`API 오류 [${code}]: ${header.resultMsg || header.message || ''}`);
        setStatus('err');
        return null;
      }
    }

    if (!body) return null;

    // items 추출 (다양한 키 대응)
    const rawItems = body['항목'] || body.items || body.data || body.item;

    if (rawItems) {
      // 중첩 구조: { 항목: { 항목: [...] } } 또는 { items: { item: [...] } }
      const inner = rawItems['항목'] || rawItems.item || rawItems;
      items = Array.isArray(inner) ? inner : (inner ? [inner] : []);
    } else {
      items = [];
    }

    totalCount = parseInt(
      body.totalCount || body.totalCnt || body['전체건수'] || items.length, 10
    );

    return { items, totalCount };
  }

  // ── CCTV 선택 ──
  function selectItem(item, el) {
    state.selected = item;
    document.querySelectorAll('.cctv-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');

    $('viewerPlaceholder').style.display = 'none';
    $('streamDetail').style.display = 'flex';

    const addr = item.LCTN_ROAD_NM_ADDR || item.LCTN_LOTNO_ADDR || '주소 없음';
    const purpose = item.INSTL_PRPS_SE_NM || '설치목적 미상';

    $('streamBox').innerHTML = `
      <span class="stream-label">${esc(addr.substring(0, 45))}</span>
      <div style="text-align:center; padding:24px;">
        <div style="font-size:52px; margin-bottom:14px;">📷</div>
        <div style="color:#4fc3f7; font-size:15px; font-weight:700; margin-bottom:6px;">
          ${esc(purpose)}
        </div>
        <div style="color:#90a4ae; font-size:12px;">${esc(addr)}</div>
        <div style="color:#78909c; font-size:11px; margin-top:10px;">
          📍 위도 ${item.WGS84_LAT || '-'} &nbsp;·&nbsp; 경도 ${item.WGS84_LOT || '-'}
        </div>
        <div style="margin-top:12px;">
          <a href="https://map.naver.com/p/search/${encodeURIComponent(addr)}"
             target="_blank" rel="noopener"
             style="color:#4fc3f7; font-size:11px; text-decoration:underline;">
            🗺️ 네이버 지도에서 보기
          </a>
          &nbsp;&nbsp;
          <a href="https://www.google.com/maps?q=${item.WGS84_LAT},${item.WGS84_LOT}"
             target="_blank" rel="noopener"
             style="color:#4fc3f7; font-size:11px; text-decoration:underline;">
            🌐 Google Maps
          </a>
        </div>
        <div style="color:#37474f; font-size:10px; margin-top:14px;">
          ※ 이 API는 CCTV 설치현황 정보를 제공하며, 실시간 영상 URL은 미포함
        </div>
      </div>
    `;

    $('infoCard').innerHTML = [
      { lbl: '관리번호',     val: item.MNG_NO },
      { lbl: '관리기관',     val: item.MNG_INST_NM },
      { lbl: '전화번호',     val: item.MNG_INST_TELNO },
      { lbl: '설치목적',     val: item.INSTL_PRPS_SE_NM },
      { lbl: '설치년월',     val: item.INSTL_YM || '-' },
      { lbl: '카메라 수',    val: item.CAM_CNTOM ? `${item.CAM_CNTOM}대` : '-' },
      { lbl: '화소수',       val: item.CAM_PIXEL_CNT ? `${item.CAM_PIXEL_CNT}만화소` : '-' },
      { lbl: '보관일수',     val: item.KPNG_DAY_CNT ?? '-' },
      { lbl: '촬영각도',     val: item.SHT_ANGLE_INFO || '-' },
      { lbl: '지번주소',     val: item.LCTN_LOTNO_ADDR || '-' },
      { lbl: '도로명주소',   val: item.LCTN_ROAD_NM_ADDR || '-' },
      { lbl: '자치단체코드', val: item.OPN_ATMY_GRP_CD },
      { lbl: '데이터기준일', val: item.DAT_CRTR_YMD },
      { lbl: '최종수정일',   val: item.LAST_MDCN_PNT },
      { lbl: '위도',         val: item.WGS84_LAT },
      { lbl: '경도',         val: item.WGS84_LOT },
    ].map(f => `
      <div class="info-field">
        <span class="lbl">${f.lbl}</span>
        <span class="val">${esc(String(f.val ?? '-'))}</span>
      </div>
    `).join('');
  }

  // ── 렌더링 ──
  function renderList(items) {
    if (!items.length) {
      $('cctvList').innerHTML = '<div class="empty-state"><p>😕 결과 없음</p><p>검색 조건을 변경해보세요</p></div>';
      $('totalCount').textContent = '0건';
      return;
    }
    $('totalCount').textContent = `${state.totalCount.toLocaleString()}건`;

    $('cctvList').innerHTML = items.map((item, i) => {
      const addr = item.LCTN_ROAD_NM_ADDR || item.LCTN_LOTNO_ADDR || '주소 없음';
      const purpose = item.INSTL_PRPS_SE_NM || '';
      const tc = purpose.includes('어린이') ? 'tag-child'
               : purpose.includes('교통') || purpose.includes('단속') ? 'tag-traffic'
               : 'tag-etc';
      return `
        <div class="cctv-item fade-in" style="animation-delay:${i*0.025}s" data-idx="${i}">
          <div class="cctv-name"><span class="dot"></span>${esc(item.MNG_INST_NM || 'CCTV')}</div>
          <div class="cctv-addr">${esc(addr)}</div>
          ${purpose ? `<span class="cctv-tag ${tc}">${esc(purpose)}</span>` : ''}
        </div>`;
    }).join('');

    $('cctvList').querySelectorAll('.cctv-item').forEach(el => {
      el.onclick = () => selectItem(state.data[+el.dataset.idx], el);
    });
  }

  function renderLoading() {
    $('cctvList').innerHTML = '<div class="loading"><div class="spinner"></div><span>조회중...</span></div>';
  }
  function renderError(msg) {
    $('cctvList').innerHTML = `<div class="empty-state"><p>❌ 조회 실패</p><p style="white-space:pre-line;margin-top:6px;font-size:11px;">${esc(msg)}</p></div>`;
    $('totalCount').textContent = '오류';
  }
  function updatePaging() {
    $('pageInfo').textContent = `${state.page} / ${state.pages}`;
    $('btnPrev').disabled = state.page <= 1;
    $('btnNext').disabled = state.page >= state.pages;
  }
  function setStatus(s) {
    const m = {
      loading: { c:'wait', t:'API 호출중...' },
      ok:      { c:'ok',   t:`연결 성공 · ${state.totalCount.toLocaleString()}건` },
      err:     { c:'err',  t:'연결 실패' },
    };
    const v = m[s] || { c:'wait', t:'대기중' };
    $('statusText').innerHTML = `<span class="status-dot ${v.c}"></span>${v.t}`;
  }
  function reset() {
    $('filterPurpose').value = '';
    $('searchKeyword').value = '';
    state.page = 1; state.data = []; state.totalCount = 0; state.pages = 0;
    $('cctvList').innerHTML = '<div class="empty-state"><p>검색 버튼을 눌러주세요</p></div>';
    $('totalCount').textContent = '0건';
    $('pageInfo').textContent = '- / -';
    $('btnPrev').disabled = $('btnNext').disabled = true;
    $('viewerPlaceholder').style.display = '';
    $('streamDetail').style.display = 'none';
    $('statusText').innerHTML = '<span class="status-dot wait"></span>대기중';
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
  function toast(msg, type='info') {
    const t = $('toast'); t.textContent = msg; t.className = `toast ${type}`;
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 4000);
  }

  return { init };
})();

document.addEventListener('DOMContentLoaded', App.init);
</script>
</body>
</html>
