
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CCTV 뷰어</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,system-ui,sans-serif;background:#0f1923;color:#e0e0e0;font-size:20px;display:flex;flex-direction:column}

.hdr{background:#1a2733;padding:18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a3a4a;flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:14px}
.hdr-l svg{width:38px;height:38px;fill:#4fc3f7}
.ht{font-size:26px;font-weight:700;color:#fff}
.hs{font-size:15px;color:#546e7a;margin-top:2px}
.btn-s{background:none;border:2px solid #37474f;color:#90a4ae;border-radius:10px;padding:16px 20px;font-size:20px;cursor:pointer;min-height:56px}
.btn-s.on{border-color:#4fc3f7;color:#4fc3f7;background:rgba(79,195,247,.1)}

.set{max-height:0;overflow:hidden;transition:max-height .4s ease;background:#162029;flex-shrink:0}
.set.open{max-height:700px;overflow-y:auto;border-bottom:1px solid #2a3a4a}
.set-in{padding:18px;display:flex;flex-direction:column;gap:16px}
.sl{font-size:18px;color:#90a4ae;font-weight:700;margin-bottom:8px;display:block}
.si{width:100%;background:#0f1923;border:2px solid #37474f;border-radius:10px;padding:18px;color:#e0e0e0;font-size:19px;outline:none}
.si:focus{border-color:#4fc3f7}
.bf{width:100%;background:#00897b;color:#fff;border:none;border-radius:10px;padding:18px;font-size:20px;font-weight:700;cursor:pointer;margin-top:8px}
.bf:active{background:#00796b}
.kd{font-size:18px;text-align:center;padding:12px;border-radius:8px;margin-top:8px;font-weight:600}
.kd-ok{color:#4caf50;background:rgba(76,175,80,.15)}
.kd-no{color:#e53935;background:rgba(229,57,53,.15)}

.srch{background:#1a2733;padding:14px 16px;border-bottom:1px solid #2a3a4a;flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.sr{display:flex;gap:8px}
.sinp{flex:1;background:#0f1923;border:2px solid #37474f;border-radius:10px;padding:18px;color:#e0e0e0;font-size:20px;outline:none;min-height:60px}
.sinp:focus{border-color:#4fc3f7}
.bgo{background:#e53935;color:#fff;border:none;border-radius:10px;padding:18px 24px;font-size:20px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:60px}
.bgo:active{background:#c62828}
.bgo:disabled{opacity:.5}
.brst{background:#37474f;color:#e0e0e0;border:none;border-radius:10px;padding:16px 20px;font-size:19px;font-weight:600;cursor:pointer;min-height:60px}
.sf{width:100%;background:#0f1923;border:2px solid #37474f;border-radius:10px;padding:16px 18px;color:#e0e0e0;font-size:19px;outline:none;min-height:60px}

.gb{background:#0f1923;border:2px solid #37474f;border-radius:10px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer}
.gb-on{border-color:#4fc3f7;background:rgba(79,195,247,.05)}
.tw{position:relative;width:58px;height:32px;flex-shrink:0}
.tw input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:#37474f;border-radius:16px;transition:background .2s;cursor:pointer}
.tsl:after{content:"";position:absolute;width:28px;height:28px;left:2px;top:2px;background:#90a4ae;border-radius:50%;transition:all .2s}
.tw input:checked+.tsl{background:#00897b}
.tw input:checked+.tsl:after{transform:translateX(26px);background:#fff}
.gi{flex:1;min-width:0}
.gt{font-size:19px;font-weight:700;color:#90a4ae}
.gt-on{color:#4fc3f7}
.gs{font-size:16px;color:#546e7a;margin-top:4px}
.gs-find{color:#ff9800}
.gs-ok{color:#4caf50}
.gs-fail{color:#e53935}
.rs{background:#162029;border:2px solid #37474f;border-radius:8px;padding:14px;color:#e0e0e0;font-size:18px;outline:none;min-height:54px}
.rs:disabled{opacity:.4}

.pr{display:flex;align-items:center;justify-content:space-between}
.pb{background:#0f1923;border:2px solid #37474f;color:#90a4ae;border-radius:8px;padding:14px 22px;font-size:19px;cursor:pointer;min-height:54px}
.pb:disabled{opacity:.3}
.pi{display:flex;flex-direction:column;align-items:center;gap:4px}
.cnt{background:#37474f;color:#90a4ae;font-size:18px;padding:8px 18px;border-radius:12px;font-weight:700}
.pgt{font-size:16px;color:#546e7a}

.tabs{display:flex;background:#1a2733;border-bottom:1px solid #2a3a4a;flex-shrink:0}
.tab{flex:1;text-align:center;padding:18px;font-size:20px;font-weight:700;color:#546e7a;cursor:pointer;border-bottom:3px solid transparent}
.tab-on{color:#4fc3f7;border-bottom-color:#4fc3f7;background:rgba(79,195,247,.05)}

.panels{flex:1;overflow:hidden;position:relative}
.pnl{display:none;position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pnl-on{display:block}

.ci{padding:22px 18px;border-bottom:1px solid #1e2d3a;cursor:pointer}
.ci:active{background:#1e2d3a}
.ci-act{background:#1a3a4a;border-left:5px solid #4fc3f7}
.cn{font-size:20px;font-weight:700;color:#e0e0e0;margin-bottom:8px}
.ca{font-size:17px;color:#546e7a;line-height:1.5}
.cdist{font-size:17px;color:#ff9800;margin-top:6px;font-weight:700}
.ctag{display:inline-block;font-size:16px;padding:6px 12px;border-radius:6px;margin-top:8px;font-weight:700}
.tag-kid{background:#1b5e20;color:#a5d6a7}
.tag-trf{background:#0d47a1;color:#90caf9}
.tag-sec{background:#4a148c;color:#ce93d8}
.tag-etc{background:#37474f;color:#b0bec5}
.tag-its{background:#e65100;color:#ffcc80}

.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:#546e7a;font-size:20px;gap:18px}
.spinner{width:50px;height:50px;border:4px solid #2a3a4a;border-top-color:#4fc3f7;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;padding:50px 20px;color:#546e7a;font-size:20px;text-align:center;gap:12px;line-height:1.7}
.ebox{background:#162029;border:1px solid #2a3a4a;border-radius:12px;padding:22px;margin-top:14px;text-align:left;width:100%}
.etitle{color:#e53935;font-size:20px;font-weight:700;margin-bottom:14px}
.estep{font-size:17px;color:#90a4ae;margin-bottom:12px;line-height:1.5}
.elog{margin-top:14px;padding:14px;background:#0f1923;border-radius:8px;font-size:14px;color:#546e7a;font-family:monospace;word-break:break-all;line-height:1.6}

.detail{padding:18px;display:flex;flex-direction:column;gap:16px}
.dh{background:#111;border-radius:14px;border:1px solid #2a3a4a;padding:30px 22px;text-align:center}
.dh-ic{font-size:64px;margin-bottom:16px}
.dh-pp{color:#4fc3f7;font-size:24px;font-weight:700;margin-bottom:12px}
.dh-org{color:#e0e0e0;font-size:20px;font-weight:600;margin-bottom:10px}
.dh-ad{color:#90a4ae;font-size:18px;margin-bottom:8px;line-height:1.5}
.dh-co{color:#546e7a;font-size:17px;margin-bottom:16px}
.dh-di{color:#ff9800;font-size:20px;font-weight:700;margin-bottom:18px}
.maplinks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.maplinks a{padding:16px 22px;border-radius:10px;font-size:18px;font-weight:700;text-decoration:none;min-height:56px;display:flex;align-items:center}
.dh-note{color:#37474f;font-size:15px;margin-top:10px}
.igrid{background:#162029;border-radius:12px;border:1px solid #2a3a4a;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ifield-l{font-size:16px;color:#546e7a;font-weight:700;margin-bottom:5px}
.ifield-v{font-size:18px;color:#e0e0e0;word-break:break-all;line-height:1.4}

/* ===== 영상 플레이어 스타일 ===== */
.video-section{background:#000;border-radius:14px;border:1px solid #2a3a4a;overflow:hidden}
.video-header{background:#1a2733;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.video-title{font-size:18px;font-weight:700;color:#4fc3f7}
.video-live{display:flex;align-items:center;gap:6px;font-size:15px;color:#e53935;font-weight:700}
.video-live-dot{width:10px;height:10px;background:#e53935;border-radius:50%;animation:blink 1s infinite}
.video-container{position:relative;width:100%;padding-top:56.25%;background:#000}
.video-container video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
.video-placeholder{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#546e7a;gap:12px;font-size:18px}
.video-placeholder .vp-icon{font-size:56px}
.video-controls{background:#1a2733;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.vc-btn{background:#37474f;color:#e0e0e0;border:none;border-radius:8px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer}
.vc-btn:active{background:#455a64}
.vc-btn-live{background:#e53935;color:#fff}
.vc-btn-live:active{background:#c62828}
.vc-status{font-size:15px;color:#90a4ae;flex:1;text-align:center}

.nearby-cctv{background:#162029;border-radius:12px;border:1px solid #2a3a4a;padding:18px}
.nearby-title{font-size:18px;font-weight:700;color:#ff9800;margin-bottom:14px}
.nearby-item{background:#0f1923;border:1px solid #2a3a4a;border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px}
.nearby-item:active{background:#1a3a4a}
.nearby-item:last-child{margin-bottom:0}
.ni-icon{font-size:28px;flex-shrink:0}
.ni-info{flex:1;min-width:0}
.ni-name{font-size:17px;font-weight:700;color:#e0e0e0;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni-dist{font-size:15px;color:#ff9800}
.ni-play{background:#e53935;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0}
.ni-play:active{background:#c62828}

.toast{position:fixed;bottom:24px;left:16px;right:16px;padding:20px 22px;border-radius:12px;font-size:19px;font-weight:700;z-index:9999;transform:translateY(150%);transition:transform .3s ease;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast-show{transform:translateY(0)}
.toast-ok{background:#1b5e20;color:#a5d6a7;border:1px solid #2e7d32}
.toast-err{background:#b71c1c;color:#ef9a9a;border:1px solid #c62828}
.toast-info{background:#0d47a1;color:#90caf9;border:1px solid #1565c0}

.stbar{background:#162029;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #2a3a4a;font-size:15px;color:#546e7a;flex-shrink:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.dot-ok{background:#4caf50}
.dot-err{background:#e53935}
.dot-wait{background:#ff9800;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="hdr">
  <div class="hdr-l">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    <div><div class="ht">CCTV 뷰어</div><div class="hs">행정안전부 + ITS 실시간 영상</div></div>
  </div>
  <button class="btn-s" id="btnSet" onclick="toggleSet()">⚙️</button>
</div>

<div class="set" id="setP">
  <div class="set-in">
    <div>
      <span class="sl">🔑 행정안전부 API 인증키</span>
      <input type="password" class="si" id="keyIn" placeholder="공공데이터포털 인증키 (CCTV 설치정보)"/>
      <button class="bf" onclick="saveKey()">인증키 저장</button>
      <div id="kd" class="kd kd-no">● 인증키 미설정</div>
    </div>
    <div>
      <span class="sl">🎥 ITS CCTV 영상 API 인증키</span>
      <input type="password" class="si" id="itsKeyIn" placeholder="ITS 국가교통정보센터 인증키"/>
      <button class="bf" onclick="saveItsKey()">ITS 인증키 저장</button>
      <div id="itsKd" class="kd kd-no">● ITS 인증키 미설정</div>
    </div>
    <div>
      <span class="sl">🌐 프록시 URL (기본 내장됨)</span>
      <input type="text" class="si" id="proxyIn" placeholder="기본 프록시가 내장되어 있습니다"/>
      <button class="bf" onclick="savePx()">프록시 변경</button>
    </div>
  </div>
</div>

<div class="srch">
  <div class="sr">
    <input type="text" class="sinp" id="addrIn" placeholder="🔍 주소 (김해시, 강남구...)" onkeydown="if(event.key==='Enter'){event.preventDefault();startSearch()}"/>
    <button class="bgo" id="btnGo" onclick="startSearch()">검색</button>
  </div>
  <div class="sr">
    <select class="sf" id="ppSel" style="flex:1">
      <option value="">전체 목적</option>
      <option value="어린이보호">🧒 어린이보호</option>
      <option value="교통단속">🚗 교통단속</option>
      <option value="방범">🔒 방범</option>
      <option value="재난재해">🌊 재난재해</option>
      <option value="주정차단속">🅿️ 주정차단속</option>
    </select>
    <select class="sf" id="srcSel" style="flex:1">
      <option value="mois">📋 행정안전부 (설치정보)</option>
      <option value="its">🎥 ITS (실시간 영상)</option>
      <option value="both">📋+🎥 통합 검색</option>
    </select>
  </div>
  <div class="gb" id="gpsBox" onclick="gpsClick(event)">
    <label class="tw" onclick="event.stopPropagation()"><input type="checkbox" id="gpsChk" onchange="toggleGPS()"/><span class="tsl"></span></label>
    <div class="gi">
      <div id="gpsT" class="gt">📍 내 위치 기반</div>
      <div id="gpsSt" class="gs">OFF</div>
    </div>
    <select class="rs" id="radSel" disabled onclick="event.stopPropagation()">
      <option value="2">2km</option><option value="5" selected>5km</option>
      <option value="7">7km</option><option value="10">10km</option>
    </select>
  </div>
  <div class="pr">
    <button class="pb" id="btnP" disabled onclick="prevPage()">◀ 이전</button>
    <div class="pi"><span class="cnt" id="totB">0건</span><span class="pgt" id="pgI">- / -</span></div>
    <button class="pb" id="btnN" disabled onclick="nextPage()">다음 ▶</button>
  </div>
</div>

<div class="tabs">
  <div id="tabList" class="tab tab-on" onclick="showTab('list')">📋 목록</div>
  <div id="tabDetail" class="tab" onclick="showTab('detail')">📷 상세</div>
  <div id="tabVideo" class="tab" onclick="showTab('video')">🎥 영상</div>
</div>

<div class="panels">
  <div id="listPanel" class="pnl pnl-on">
    <div id="lw"><div class="empty"><div style="font-size:60px">🔍</div><div>주소를 입력하거나<br>📍 내 위치를 켜고 검색하세요</div></div></div>
  </div>
  <div id="detailPanel" class="pnl">
    <div id="dw"><div class="empty"><div style="font-size:60px">📷</div><div>목록에서 CCTV를 선택하세요</div></div></div>
  </div>
  <div id="videoPanel" class="pnl">
    <div id="vw">
      <div class="empty"><div style="font-size:60px">🎥</div><div>ITS CCTV를 선택하면<br>실시간 영상을 볼 수 있습니다</div><div style="font-size:16px;color:#546e7a;margin-top:8px">※ ITS 인증키 필요 (설정에서 입력)</div></div>
    </div>
  </div>
</div>

<div class="stbar">
  <div id="stT"><span class="dot dot-wait"></span>대기중</div>
  <div id="epT" style="font-size:13px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
</div>

<script>
// ===== 설정 =====
var DEFAULT_PROXY = 'https://script.google.com/macros/s/AKfycbwjGtN8RwhdNWZui22LDfur43I6gkJWA7irO5LxQjKS2ZOJ2keatVT7TwGhyArmDzts/exec';
var API_BASE = 'https://apis.data.go.kr/1741000/cctv_info';
var ITS_API_BASE = 'https://openapi.its.go.kr:9443/cctvInfo';
var PAGE_SIZE = 20;
var FETCH_TIMEOUT = 12000;

// ===== 상태 =====
var apiKey = '';
var itsApiKey = '';
var proxyBase = '';
var items = [];
var itsItems = [];
var gpsItems = [];
var total = 0;
var pg = 1;
var pgMax = 0;
var busy = false;
var gpsOn = false;
var myLat = null;
var myLon = null;
var myRad = 5;
var logs = [];
var currentHls = null;
var currentVideoItem = null;

// ===== 유틸 =====
function byId(id) { return document.getElementById(id); }
function safeStr(v) { return (v === null || v === undefined) ? '-' : String(v); }
function escHtml(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

function showToast(msg, type) {
  var el = byId('toast');
  el.textContent = msg;
  el.className = 'toast toast-' + (type || 'info');
  setTimeout(function() { el.className += ' toast-show'; }, 10);
  clearTimeout(el.tmr);
  el.tmr = setTimeout(function() { el.className = el.className.replace(' toast-show', ''); }, 4500);
}

function havDist(lat1, lon1, lat2, lon2) {
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function fmtDist(m) { return (m >= 1000) ? (m/1000).toFixed(1) + 'km' : Math.round(m) + 'm'; }

function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var done = false;
    var timer = setTimeout(function() { if (!done) { done = true; reject(new Error('timeout')); } }, ms || FETCH_TIMEOUT);
    fetch(url).then(function(r) { if (!done) { done = true; clearTimeout(timer); resolve(r); } })
    .catch(function(e) { if (!done) { done = true; clearTimeout(timer); reject(e); } });
  });
}

function proxyFetch(apiUrl) {
  var base = proxyBase || DEFAULT_PROXY;
  var sep = (base.indexOf('?') >= 0) ? '&' : '?';
  var fullUrl = base + sep + 'url=' + encodeURIComponent(apiUrl);
  byId('epT').textContent = '🔄 프록시 호출중...';
  return fetchWithTimeout(fullUrl).then(function(r) {
    if (r.ok) { byId('epT').textContent = '✅ 프록시 연결 성공'; return r; }
    logs.push('프록시: HTTP ' + r.status); return null;
  }).catch(function(e) {
    var msg = (e.message === 'timeout') ? '타임아웃(12초)' : e.message;
    logs.push('프록시: ' + msg); byId('epT').textContent = '❌ ' + msg; return null;
  });
}

// ===== 초기화 =====
function initApp() {
  var savedKey = lsGet('cctv_key');
  if (savedKey) { apiKey = savedKey; byId('keyIn').value = savedKey; setKeyStatus(true); }
  var savedItsKey = lsGet('its_key');
  if (savedItsKey) { itsApiKey = savedItsKey; byId('itsKeyIn').value = savedItsKey; setItsKeyStatus(true); }
  var savedPx = lsGet('cctv_proxy');
  if (savedPx) { proxyBase = savedPx; byId('proxyIn').value = savedPx; }
}

function toggleSet() { byId('setP').classList.toggle('open'); byId('btnSet').classList.toggle('on'); }

function saveKey() {
  var k = byId('keyIn').value.trim();

}

function saveItsKey() {

function savePx() {

// ===== GPS =====
function gpsClick(e) {
  var tag = e.target.tagName;
  if (tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'OPTION') byId('gpsChk').click();
}

function toggleGPS() {
  gpsOn = byId('gpsChk').checked;
  byId('radSel').disabled = !gpsOn;
  byId('gpsT').className = gpsOn ? 'gt gt-on' : 'gt';
  byId('gpsBox').className = gpsOn ? 'gb gb-on' : 'gb';
  if (gpsOn) { if (myLat) showGpsCoord(); else getGpsLocation(); }
  else { byId('gpsSt').textContent = 'OFF'; byId('gpsSt').className = 'gs'; }
}

function getGpsLocation() {
  if (!navigator.geolocation) { gpsFail('GPS 미지원'); return; }
  byId('gpsSt').textContent = '위치 확인중...'; byId('gpsSt').className = 'gs gs-find';
  navigator.geolocation.getCurrentPosition(
    function(p) { myLat = p.coords.latitude; myLon = p.coords.longitude; showGpsCoord(); showToast('📍 위치 확인됨', 'ok'); },
    function() { gpsFail('위치 확인 실패'); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function gpsFail(msg) {
  byId('gpsSt').textContent = msg; byId('gpsSt').className = 'gs gs-fail';
  byId('gpsChk').checked = false; gpsOn = false; byId('radSel').disabled = true;
  byId('gpsBox').className = 'gb'; showToast(msg, 'err');
}

function showGpsCoord() {
  byId('gpsSt').textContent = '📍 ' + myLat.toFixed(4) + ', ' + myLon.toFixed(4);
  byId('gpsSt').className = 'gs gs-ok';
}

// ===== 탭 =====
function showTab(name) {
  byId('tabList').className = (name === 'list') ? 'tab tab-on' : 'tab';
  byId('tabDetail').className = (name === 'detail') ? 'tab tab-on' : 'tab';
  byId('tabVideo').className = (name === 'video') ? 'tab tab-on' : 'tab';
  byId('listPanel').className = (name === 'list') ? 'pnl pnl-on' : 'pnl';
  byId('detailPanel').className = (name === 'detail') ? 'pnl pnl-on' : 'pnl';
  byId('videoPanel').className = (name === 'video') ? 'pnl pnl-on' : 'pnl';
}

// ===== 페이지 =====
function prevPage() { if (pg > 1) { pg--; doPaginate(); } }
function nextPage() { if (pg < pgMax) { pg++; doPaginate(); } }
function updatePaging() {
  byId('pgI').textContent = pg + ' / ' + pgMax;
  byId('btnP').disabled = (pg <= 1); byId('btnN').disabled = (pg >= pgMax);
}

function doPaginate() {
  if (gpsItems.length) {
    var start = (pg - 1) * PAGE_SIZE;
    items = gpsItems.slice(start, start + PAGE_SIZE);
    renderList(items, true);
  } else { renderList(items, false); }
  updatePaging();
}

// ===== 행정안전부 API 파라미터 =====
function buildParams(pageNum) {
  var p = 'serviceKey=' + apiKey + '&pageNo=' + (pageNum || pg) + '&numOfRows=' + PAGE_SIZE + '&returnType=json';
  var addr = byId('addrIn').value.trim();
  if (addr) p += '&LCTN_LOTNO_ADDR=' + encodeURIComponent(addr);
  return p;
}

// ===== ITS API 호출 =====
function searchITS() {
  if (!itsApiKey) {
    showToast('⚙️ ITS 인증키를 먼저 설정해주세요', 'err');
    byId('setP').classList.add('open'); byId('btnSet').classList.add('on'); return;
  }
  if (!gpsOn || !myLat) {
    showToast('📍 ITS 검색은 위치 기반이 필요합니다', 'info'); return;
  }
  busy = true; logs = []; setStatusBar('wait'); showLoadingUI();

  var rad = Number(byId('radSel').value);
  var minX = myLon - (rad * 0.012);
  var maxX = myLon + (rad * 0.012);
  var minY = myLat - (rad * 0.009);
  var maxY = myLat + (rad * 0.009);

  var itsUrl = ITS_API_BASE + '?apiKey=' + itsApiKey
    + '&type=its&cctvType=1'
    + '&minX=' + minX.toFixed(6) + '&maxX=' + maxX.toFixed(6)
    + '&minY=' + minY.toFixed(6) + '&maxY=' + maxY.toFixed(6)
    + '&getType=json';

  proxyFetch(itsUrl).then(function(res) {
    if (!res) {
      setStatusBar('err'); showErrorUI('ITS API 호출 실패');
      busy = false; byId('btnGo').disabled = false; return;
    }
    return res.text().then(function(txt) {
      var j;
      try { j = JSON.parse(txt); } catch(e) {
        logs.push('ITS JSON 파싱 실패'); setStatusBar('err');
        showErrorUI('ITS 응답 파싱 실패'); busy = false; byId('btnGo').disabled = false; return;
      }

      var data = j.response && j.response.data ? j.response.data : (j.data || []);
      if (!Array.isArray(data)) data = [];

      // 거리 계산 및 정렬
      itsItems = [];
      for (var i = 0; i < data.length; i++) {
        var it = data[i];
        var la = parseFloat(it.coordy);
        var lo = parseFloat(it.coordx);
        if (isNaN(la) || isNaN(lo)) continue;
        it._dist = havDist(myLat, myLon, la, lo);
        it._isITS = true;
        itsItems.push(it);
      }
      itsItems.sort(function(a, b) { return a._dist - b._dist; });

      items = itsItems;
      total = itsItems.length;
      pgMax = Math.max(1, Math.ceil(total / PAGE_SIZE));
      pg = 1;
      renderList(items.slice(0, PAGE_SIZE), true);
      updatePaging();
      setStatusBar('ok');
      showToast('🎥 ITS CCTV ' + total + '건 조회', 'ok');
      busy = false; byId('btnGo').disabled = false;
    });
  }).catch(function(e) {
    logs.push('ITS 호출 오류: ' + e.message);
    setStatusBar('err'); showErrorUI('ITS API 호출 실패');
    busy = false; byId('btnGo').disabled = false;
  });
}

// ===== 검색 =====
function startSearch() {
  var src = byId('srcSel').value;
  myRad = Number(byId('radSel').value);
  pg = 1;
  byId('btnGo').disabled = true;

  if (src === 'its') {
    searchITS(); return;
  }

  if (!apiKey) {
    showToast('⚙️ 인증키를 먼저 설정해주세요', 'err');
    byId('setP').classList.add('open'); byId('btnSet').classList.add('on');
    byId('btnGo').disabled = false; return;
  }

  if (gpsOn) {
    if (!myLat) { showToast('위치 확인 중...', 'info'); byId('btnGo').disabled = false; return; }
    searchGPS();
  } else {
    searchNormal();
  }

  // 통합 검색 시 ITS도 병렬 호출
  if (src === 'both' && itsApiKey && gpsOn && myLat) {
    searchITSBackground();
  }
}

function searchITSBackground() {
  var rad = Number(byId('radSel').value);
  var minX = myLon - (rad * 0.012), maxX = myLon + (rad * 0.012);
  var minY = myLat - (rad * 0.009), maxY = myLat + (rad * 0.009);
  var itsUrl = ITS_API_BASE + '?apiKey=' + itsApiKey
    + '&type=its&cctvType=1'
    + '&minX=' + minX.toFixed(6) + '&maxX=' + maxX.toFixed(6)
    + '&minY=' + minY.toFixed(6) + '&maxY=' + maxY.toFixed(6)
    + '&getType=json';

  proxyFetch(itsUrl).then(function(res) {
    if (!res) return;
    return res.text().then(function(txt) {
      var j;
      try { j = JSON.parse(txt); } catch(e) { return; }
      var data = j.response && j.response.data ? j.response.data : (j.data || []);
      if (!Array.isArray(data)) return;
      itsItems = [];
      for (var i = 0; i < data.length; i++) {
        var it = data[i];
        var la = parseFloat(it.coordy), lo = parseFloat(it.coordx);
        if (isNaN(la) || isNaN(lo)) continue;
        it._dist = havDist(myLat, myLon, la, lo);
        it._isITS = true;
        itsItems.push(it);
      }
      if (itsItems.length) showToast('🎥 주변 ITS CCTV ' + itsItems.length + '건 발견', 'info');
    });
  }).catch(function() {});
}

function searchNormal() {
  if (busy) return;
  busy = true; gpsItems = []; logs = []; setStatusBar('wait'); showLoadingUI();
  var apiUrl = API_BASE + '/info?' + buildParams();
  proxyFetch(apiUrl).then(function(res) {
    if (!res) { setStatusBar('err'); showErrorUI(); showToast('❌ API 호출 실패', 'err'); busy = false; byId('btnGo').disabled = false; return; }
    return res.text().then(function(txt) {
      var j;
      try { j = JSON.parse(txt); } catch(e) {
        logs.push('JSON 파싱 실패'); setStatusBar('err'); showErrorUI('응답 파싱 실패');
        busy = false; byId('btnGo').disabled = false; return;
      }
      if (j.OpenAPI_ServiceResponse) {
        var errHdr = j.OpenAPI_ServiceResponse.cmmMsgHeader || {};
        var errMsg = errHdr.returnAuthMsg || errHdr.errMsg || 'API 오류';
        logs.push('API 오류: ' + errMsg); setStatusBar('err'); showErrorUI('API 오류: ' + errMsg);
        busy = false; byId('btnGo').disabled = false; return;
      }
      var parsed = parseApiResponse(j);
      if (!parsed) { setStatusBar('err'); showErrorUI('응답 구조 인식 실패'); busy = false; byId('btnGo').disabled = false; return; }
      items = parsed.items; total = parsed.totalCount;
      pgMax = Math.max(1, Math.ceil(total / PAGE_SIZE));
      filterResults(); renderList(items, false); updatePaging();
      setStatusBar('ok'); showToast('✅ ' + total.toLocaleString() + '건 조회', 'ok');
      busy = false; byId('btnGo').disabled = false;
    });
  }).catch(function(e) {
    logs.push('호출 오류: ' + e.message); setStatusBar('err'); showErrorUI();
    busy = false; byId('btnGo').disabled = false;
  });
}

function searchGPS() {
  if (busy) return;
  busy = true; gpsItems = []; logs = []; setStatusBar('wait'); showLoadingUI();
  var allData = []; var pageNum = 1;
  function loadNext() {
    if (pageNum > 10) return finishGPS(allData);
    var apiUrl = API_BASE + '/info?' + buildParams(pageNum);
    return proxyFetch(apiUrl).then(function(res) {
      if (!res) { if (pageNum === 1) { showErrorUI(); setStatusBar('err'); busy = false; byId('btnGo').disabled = false; return; } return finishGPS(allData); }
      return res.text().then(function(txt) {
        var j;
        try { j = JSON.parse(txt); } catch(e) { if (pageNum === 1) { showErrorUI('응답 파싱 실패'); setStatusBar('err'); busy = false; byId('btnGo').disabled = false; return; } return finishGPS(allData); }
        if (j.OpenAPI_ServiceResponse) { if (pageNum === 1) { var em = (j.OpenAPI_ServiceResponse.cmmMsgHeader||{}).returnAuthMsg||'API 오류'; showErrorUI('API 오류: '+em); setStatusBar('err'); busy = false; byId('btnGo').disabled = false; return; } return finishGPS(allData); }
        var parsed = parseApiResponse(j);
        if (!parsed) { if (pageNum === 1) { showErrorUI('응답 구조 인식 실패'); setStatusBar('err'); busy = false; byId('btnGo').disabled = false; return; } return finishGPS(allData); }
        allData = allData.concat(parsed.items);
        byId('totB').textContent = allData.length + '건 수집중...';
        if (parsed.items.length < PAGE_SIZE) return finishGPS(allData);
        pageNum++; return loadNext();
      });
    }).catch(function() { if (pageNum === 1) { showErrorUI(); setStatusBar('err'); busy = false; byId('btnGo').disabled = false; return; } return finishGPS(allData); });
  }
  loadNext();
}

function finishGPS(allData) {
  var maxDist = myRad * 1000;
  var purpose = byId('ppSel').value;
  gpsItems = [];
  for (var i = 0; i < allData.length; i++) {
    var it = allData[i];
    var la = parseFloat(it.WGS84_LAT), lo = parseFloat(it.WGS84_LOT);
    if (isNaN(la) || isNaN(lo)) continue;
    var d = havDist(myLat, myLon, la, lo);
    if (d > maxDist) continue;
    if (purpose && (it.INSTL_PRPS_SE_NM || '').indexOf(purpose) < 0) continue;
    var copy = {}; for (var k in it) { if (it.hasOwnProperty(k)) copy[k] = it[k]; }
    copy._dist = d; gpsItems.push(copy);
  }
  gpsItems.sort(function(a, b) { return a._dist - b._dist; });
  total = gpsItems.length; pgMax = Math.max(1, Math.ceil(gpsItems.length / PAGE_SIZE)); pg = 1;
  doPaginate(); setStatusBar('ok');
  showToast('📍 반경 ' + myRad + 'km 내 ' + gpsItems.length + '건', 'ok');
  busy = false; byId('btnGo').disabled = false;
}

// ===== 응답 파싱 =====
function parseApiResponse(j) {
  var body = null, hdr = null;
  if (j.response) { hdr = j.response.header; body = j.response.body; }
  else if (j.body || j.items || j.item) { body = j.body || j; }
  else return null;
  if (hdr) { var code = String(hdr.resultCode || ''); if (code !== '00' && code !== '0' && code !== '') return null; }
  if (!body) return null;
  var raw = body.items || body.item;
  var arr = [];
  if (raw) { var inner = raw.item || raw; arr = Array.isArray(inner) ? inner : (inner ? [inner] : []); }
  return { items: arr, totalCount: parseInt(body.totalCount || arr.length, 10) };
}

function filterResults() {
  var purpose = byId('ppSel').value;
  var addr = byId('addrIn').value.trim();
  if (purpose) items = items.filter(function(it) { return (it.INSTL_PRPS_SE_NM || '').indexOf(purpose) >= 0; });
  if (addr && items.length) {
    var filtered = items.filter(function(it) { return ((it.LCTN_LOTNO_ADDR||'')+(it.LCTN_ROAD_NM_ADDR||'')+(it.MNG_INST_NM||'')).indexOf(addr) >= 0; });
    if (filtered.length) items = filtered;
  }
}

// ===== UI 렌더링 =====
function renderList(data, showDist) {
  if (!data.length) {
    byId('lw').innerHTML = '<div class="empty"><div style="font-size:52px">😕</div><div>검색 결과가 없습니다</div></div>';
    byId('totB').textContent = '0건'; return;
  }
  byId('totB').textContent = total.toLocaleString() + '건';
  var html = '';
  for (var i = 0; i < data.length; i++) {
    var it = data[i];
    if (it._isITS) {
      // ITS CCTV 항목
      html += '<div class="ci" onclick="selectITSItem(' + i + ')">';
      html += '<div class="cn">🎥 ' + escHtml(it.cctvname || 'ITS CCTV') + '</div>';
      html += '<div class="ca">' + escHtml(it.cctvname || '도로 CCTV') + '</div>';
      if (it._dist != null) html += '<div class="cdist">📏 ' + fmtDist(it._dist) + '</div>';
      html += '<span class="ctag tag-its">🎥 실시간 영상</span>';
      html += '</div>';
    } else {
      // 행정안전부 CCTV 항목
      var addr = it.LCTN_ROAD_NM_ADDR || it.LCTN_LOTNO_ADDR || '주소 없음';
      var pp = it.INSTL_PRPS_SE_NM || '';
      var tagClass = 'tag-etc';
      if (pp.indexOf('어린이') >= 0) tagClass = 'tag-kid';
      else if (pp.indexOf('교통') >= 0 || pp.indexOf('단속') >= 0) tagClass = 'tag-trf';
      else if (pp.indexOf('방범') >= 0) tagClass = 'tag-sec';
      html += '<div class="ci" onclick="selectItem(' + i + ')">';
      html += '<div class="cn">' + escHtml(it.MNG_INST_NM || 'CCTV') + '</div>';
      html += '<div class="ca">' + escHtml(addr) + '</div>';
      if (showDist && it._dist != null) html += '<div class="cdist">📏 ' + fmtDist(it._dist) + '</div>';
      if (pp) html += '<span class="ctag ' + tagClass + '">' + escHtml(pp) + '</span>';
      html += '</div>';
    }
  }
  byId('lw').innerHTML = html;
}

// ===== ITS CCTV 선택 → 영상 재생 =====
function selectITSItem(idx) {
  var it = items[idx];
  if (!it) return;

  var els = document.querySelectorAll('.ci');
  for (var i = 0; i < els.length; i++) els[i].className = 'ci';
  if (els[idx]) els[idx].className = 'ci ci-act';

  currentVideoItem = it;
  playITSVideo(it);
  showTab('video');
}

function playITSVideo(it) {
  var cctvUrl = it.cctvurl || '';
  var cctvName = it.cctvname || 'ITS CCTV';
  var distStr = (it._dist != null) ? fmtDist(it._dist) : '';

  var h = '<div class="detail">';

  // 영상 플레이어
  h += '<div class="video-section">';
  h += '<div class="video-header">';
  h += '<div class="video-title">' + escHtml(cctvName) + '</div>';
  h += '<div class="video-live"><span class="video-live-dot"></span>LIVE</div>';
  h += '</div>';
  h += '<div class="video-container">';
  if (cctvUrl) {
    h += '<video id="hlsVideo" autoplay muted playsinline></video>';
  } else {
    h += '<div class="video-placeholder"><div class="vp-icon">📡</div><div>영상 URL 없음</div></div>';
  }
  h += '</div>';
  h += '<div class="video-controls">';
  h += '<button class="vc-btn vc-btn-live" onclick="reloadVideo()">🔄 새로고침</button>';
  h += '<span id="vcStatus" class="vc-status">연결중...</span>';
  h += '<button class="vc-btn" onclick="toggleMute()">🔊 음소거</button>';
  h += '</div>';
  h += '</div>';

  // CCTV 정보
  h += '<div class="igrid">';
  h += '<div><div class="ifield-l">CCTV명</div><div class="ifield-v">' + escHtml(cctvName) + '</div></div>';
  h += '<div><div class="ifield-l">거리</div><div class="ifield-v">' + (distStr || '-') + '</div></div>';
  h += '<div><div class="ifield-l">위도</div><div class="ifield-v">' + safeStr(it.coordy) + '</div></div>';
  h += '<div><div class="ifield-l">경도</div><div class="ifield-v">' + safeStr(it.coordx) + '</div></div>';
  h += '</div>';

  // 지도 링크
  if (it.coordy && it.coordx) {
    h += '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">';
    h += '<a href="https://map.kakao.com/link/map/' + encodeURIComponent(cctvName) + ',' + it.coordy + ',' + it.coordx + '" target="_blank" style="padding:16px 22px;border-radius:10px;font-size:18px;font-weight:700;text-decoration:none;background:#FAE100;color:#3C1E1E">🗺 카카오</a>';
    h += '<a href="https://www.google.com/maps?q=' + it.coordy + ',' + it.coordx + '" target="_blank" style="padding:16px 22px;border-radius:10px;font-size:18px;font-weight:700;text-decoration:none;background:#4285F4;color:#fff">🌐 구글</a>';
    h += '</div>';
  }

  // 주변 ITS CCTV 목록
  if (itsItems.length > 1) {
    h += '<div class="nearby-cctv">';
    h += '<div class="nearby-title">📡 주변 ITS CCTV</div>';
    var count = 0;
    for (var i = 0; i < itsItems.length && count < 5; i++) {
      var nb = itsItems[i];
      if (nb === it) continue;
      h += '<div class="nearby-item" onclick="playNearbyITS(' + i + ')">';
      h += '<div class="ni-icon">🎥</div>';
      h += '<div class="ni-info"><div class="ni-name">' + escHtml(nb.cctvname || 'CCTV') + '</div>';
      h += '<div class="ni-dist">📏 ' + fmtDist(nb._dist) + '</div></div>';
      h += '<div class="ni-play">▶ 재생</div>';
      h += '</div>';
      count++;
    }
    h += '</div>';
  }

  h += '</div>';
  byId('vw').innerHTML = h;

  // HLS 스트림 재생
  if (cctvUrl) {
    setTimeout(function() { initHlsPlayer(cctvUrl); }, 100);
  }
}

function playNearbyITS(idx) {
  var it = itsItems[idx];
  if (!it) return;
  currentVideoItem = it;
  playITSVideo(it);
}

function initHlsPlayer(url) {
  var video = byId('hlsVideo');
  if (!video) return;

  // 기존 HLS 인스턴스 정리
  if (currentHls) { currentHls.destroy(); currentHls = null; }

  var statusEl = byId('vcStatus');

  if (Hls.isSupported()) {
    var hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      maxBufferLength: 10,
      maxMaxBufferLength: 30
    });
    currentHls = hls;

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play().catch(function() {});
      if (statusEl) statusEl.textContent = '🟢 실시간 스트리밍 중';
    });

    hls.on(Hls.Events.ERROR, function(event, data) {
      if (statusEl) statusEl.textContent = '⚠️ ' + (data.details || '스트림 오류');
      if (data.fatal) {
        switch(data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            if (statusEl) statusEl.textContent = '🔴 네트워크 오류 - 재시도중...';
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            if (statusEl) statusEl.textContent = '🔴 미디어 오류 - 복구중...';
            hls.recoverMediaError();
            break;
          default:
            if (statusEl) statusEl.textContent = '🔴 재생 불가';
            hls.destroy();
            break;
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari 네이티브 HLS
    video.src = url;
    video.addEventListener('loadedmetadata', function() {
      video.play().catch(function() {});
      if (statusEl) statusEl.textContent = '🟢 실시간 스트리밍 중';
    });
  } else {
    if (statusEl) statusEl.textContent = '🔴 HLS 미지원 브라우저';
  }
}
